# Self-healing settings (override any of them with -D<name>=<value>)

# Language of the console trace, demo overlay and report (the report can switch in the browser): en (default) | de | ru | ja | tr | ar
healer.language=en

# off | suggest | auto
healer.mode=auto
# How long to wait for the original selector before treating it as broken (SPA render delay)
healer.probeTimeoutMs=3000
# Heuristic/LLM matches below this score are rejected
healer.minConfidence=0.60
# Best match must beat the runner-up by this much (avoids picking between look-alikes)
healer.minMargin=0.08
# Where fingerprints and healed selectors are stored (commit this folder to share baselines)
healer.storeDir=.healer
healer.reportDir=target/healer-report
# Screenshot of every healed element (framed in green) for the report
healer.screenshots=true
# Also print the HTML report to healing-report.pdf at the end of the run (uses the installed Edge)
healer.report.pdf=true
healer.report.pdfBrowser=msedge
# Print every healing step (candidates, scores, Claude answer, cost) to the console
healer.verbose=true
# true = a healed test fails instead of passing with WARN (strict CI)
healer.failOnHeal=false
# LLM stage (Claude) - used only when the local heuristic is not confident.
# Needs the healer-claude dependency and the ANTHROPIC_API_KEY environment variable.
healer.llm.enabled=true
# Cheapest model that handled every demo case (~$0.002 per heal)
healer.llm.model=claude-haiku-4-5
# Asked only when the first model finds no match or is not confident (leave empty to disable)
healer.llm.escalateTo=claude-opus-5
# low | medium | high | xhigh | max (ignored by Haiku)
healer.llm.effort=low
# Language of Claude's reasoning (defaults to the healer.language: en -> English, tr -> Turkish)
# Candidates sent to Claude (best local matches first) - fewer = cheaper
healer.llm.candidates=10
healer.llm.maxCallsPerRun=50
healer.llm.timeoutSeconds=90
