# Settings of this project. Layers on top (later wins): healer-<profile>.properties (-Dhealer.profile=ci),
# healer-local.properties (personal, not committed), environment variables (HEALER_*, BROWSER_*, APP_*), -D.

# --- application and browser
app.baseUrl=https://trip-forge-lbuh.vercel.app
# chromium | msedge | chrome | firefox | webkit
browser.name=msedge
browser.headless=true
# ms between browser actions - e.g. 300 to watch a run
browser.slowmo=0
browser.viewport=1280x900
browser.timeoutMs=15000
# off | failures | all - linked on the test in the report
browser.video=failures
browser.trace=failures

# --- healing
healer.language=en
healer.mode=auto
# every page load changes all ids, so broken selectors are the rule here: keep the probe short
healer.probeTimeoutMs=2000
healer.minConfidence=0.60
healer.minMargin=0.08
healer.storeDir=.healer
healer.verbose=true
healer.visual=false
healer.failOnHeal=false

# --- report
healer.reportDir=target/healer-report
# never | always | onFailure | onWarn (failures or heals) - never on CI
healer.report.open=onWarn
# auto = everywhere except on CI
healer.report.pdf=auto
healer.report.pdfBrowser=msedge
# all | failures | none
healer.report.screenshots=all
healer.report.history=true
healer.report.historyKeep=10

# --- Claude (needs the API key; never write the key itself into this file)
healer.llm.enabled=true
healer.llm.apiKey=${env:ANTHROPIC_API_KEY}
healer.llm.model=claude-haiku-4-5
healer.llm.escalateTo=claude-opus-5
# USD for all Claude calls of one run; empty = no limit
healer.llm.maxCostPerRun=1.00
healer.llm.candidates=10
healer.llm.maxCallsPerRun=50
