<!doctype html><html><head><meta charset="utf-8"><title>Contact</title></head><body>
<form onsubmit="return false">
  <label for="full-name">Name</label><input id="full-name" name="fullname" type="text">
  <label for="mail">Email</label><input id="mail" name="contact-mail" type="email">
  <button type="button" id="store" data-testid="store-btn" class="button primary-action"
          onclick="document.getElementById('out').textContent='Saved'">Save</button>
  <button type="button" id="cancel" class="btn" onclick="document.getElementById('out').textContent='Cancelled'">Cancel</button>
</form><p id="out"></p></body></html>
